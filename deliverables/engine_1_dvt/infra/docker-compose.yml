version: "3.8"

# ==============================================================================
# Obol Charon DVT + Lighthouse + Nethermind Staking Stack
# Topology: 4-Node DVT Cluster (3-of-4 Byzantine Fault Tolerant)
# Integration: Lido Community Staking Module (CSM V3)
# ==============================================================================

networks:
  dvt-internal:
    driver: bridge

volumes:
  nethermind_data:
  lighthouse_bn_data:
  lighthouse_vc_data:
  prometheus_data:

services:
  # ----------------------------------------------------------------------------
  # 1. Execution Client: Nethermind
  # ----------------------------------------------------------------------------
  nethermind:
    image: nethermindeth/nethermind:1.30.0
    container_name: csm_nethermind
    restart: unless-stopped
    networks:
      - dvt-internal
    environment:
      - NETHERMIND_CONFIG=${NETWORK:-mainnet}
    volumes:
      - nethermind_data:/nethermind/data
      - ./jwt.hex:/nethermind/jwt.hex:ro
    ports:
      - "30303:30303/tcp"    # EL P2P TCP
      - "30303:30303/udp"    # EL P2P UDP
    command:
      - --config=${NETWORK:-mainnet}
      - --datadir=/nethermind/data
      - --Init.WebSocketsEnabled=true
      - --JsonRpc.Enabled=true
      - --JsonRpc.Host=0.0.0.0
      - --JsonRpc.Port=8545
      - --JsonRpc.EngineHost=0.0.0.0
      - --JsonRpc.EnginePort=8551
      - --JsonRpc.JwtSecretFile=/nethermind/jwt.hex
      - --JsonRpc.AdditionalRpcUrls=http://0.0.0.0:8551|http;ws|engine;eth;subscribe
      - --Network.DiscoveryPort=30303
      - --Network.P2PPort=30303
      - --Network.MaxActivePeers=50
      - --Pruning.CacheMb=4096
      - --Metrics.Enabled=true
      - --Metrics.ExposePort=6060
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Consensus Client (Beacon Node): Lighthouse
  # ----------------------------------------------------------------------------
  lighthouse_bn:
    image: sigp/lighthouse:v6.0.1
    container_name: csm_lighthouse_bn
    restart: unless-stopped
    networks:
      - dvt-internal
    depends_on:
      - nethermind
      - mev_boost
    volumes:
      - lighthouse_bn_data:/root/.lighthouse
      - ./jwt.hex:/jwt.hex:ro
    ports:
      - "9000:9000/tcp"      # CL P2P TCP
      - "9000:9000/udp"      # CL P2P UDP
    command:
      - lighthouse
      - bn
      - --network=${NETWORK:-mainnet}
      - --datadir=/root/.lighthouse
      - --execution-endpoint=http://nethermind:8551
      - --execution-jwt=/jwt.hex
      - --checkpoint-sync-url=${CHECKPOINT_SYNC_URL:-https://mainnet.checkpoint.sigp.io}
      - --builder=http://mev_boost:18550
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --http-allow-origin=*
      - --metrics
      - --metrics-address=0.0.0.0
      - --metrics-port=5054
      - --metrics-allow-origin=*
      - --target-peers=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5052/eth/v1/node/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2b. MEV-Boost: External Block Builder Relay Proxy
  # ----------------------------------------------------------------------------
  mev_boost:
    image: flashbots/mev-boost:v1.8.0
    container_name: csm_mev_boost
    restart: unless-stopped
    networks:
      - dvt-internal
    command:
      - -${NETWORK:-mainnet}
      - -loglevel=info
      - -addr=0.0.0.0:18550
      - -relay-check
      - -relays=${MEV_RELAYS:-https://0xac6e77dfe25ecd6110b8e780608cce0dab71fdd5ebea22a16c0205200f2f8424e0004fcedfe20fe6d412d3257371c26e@builder-relay.flashbots.net,https://0xa1559ace749688b30f0e49e130e1528612e3a04643a508b90224130f01a454c60651307141b073b80b0422a433080e70@relay.ultrasound.money,https://0xa7ab67ea25d143680e14cb7b0154784111295a05401583ab89f63925844048b88170829164866b399d713c57b60fd9d3@agnostic-relay.net}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18550/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. DVT Middleware: Obol Charon (3-of-4 BFT Proxy)
  # ----------------------------------------------------------------------------
  charon:
    image: obolnetwork/charon:v1.3.0
    container_name: csm_charon
    restart: unless-stopped
    networks:
      - dvt-internal
    depends_on:
      - lighthouse_bn
    volumes:
      - ./.charon:/opt/charon/.charon:rw
    ports:
      - "3610:3610/tcp"              # Charon P2P TCP (Expose to WAN/Mesh)
      - "3610:3610/udp"              # Charon P2P UDP (Expose to WAN/Mesh)
      - "127.0.0.1:3600:3600"        # Validator Client Proxy (Localhost only)
      - "127.0.0.1:3620:3620"        # Prometheus Metrics (Localhost only)
    command:
      - run
      - --beacon-node-endpoints=http://lighthouse_bn:5052
      - --simulated-beacon-node-url=http://lighthouse_bn:5052
      - --p2p-tcp-address=0.0.0.0:3610
      - --p2p-udp-address=0.0.0.0:3610
      - --p2p-relays=https://0.relay.obol.tech,https://1.relay.obol.tech
      - --validator-api-address=0.0.0.0:3600
      - --monitoring-address=0.0.0.0:3620
      - --log-level=info
      - --log-format=console
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3620/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. Validator Client: Lighthouse VC
  # ----------------------------------------------------------------------------
  lighthouse_vc:
    image: sigp/lighthouse:v6.0.1
    container_name: csm_lighthouse_vc
    restart: unless-stopped
    networks:
      - dvt-internal
    depends_on:
      - charon
    volumes:
      - ./.charon/validator_keys:/opt/charon/validator_keys:ro
      - lighthouse_vc_data:/root/.lighthouse
    command:
      - lighthouse
      - vc
      - --network=${NETWORK:-mainnet}
      - --beacon-nodes=http://charon:3600
      - --validators-dir=/opt/charon/validator_keys
      - --secrets-dir=/opt/charon/validator_keys
      - --suggested-fee-recipient=${FEE_RECIPIENT_ADDRESS:-0x388C818CA8B9251b393131C08a736829d0f89252}
      - --builder-proposals
      - --metrics
      - --metrics-address=0.0.0.0
      - --metrics-port=5056
      - --metrics-allow-origin=*
      - --init-slashing-protection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5056/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # 5. Monitoring & Observability: Prometheus
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: csm_prometheus
    restart: unless-stopped
    networks:
      - dvt-internal
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
